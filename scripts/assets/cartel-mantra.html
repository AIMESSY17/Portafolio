<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden}
body{background:radial-gradient(120% 90% at 30% 20%,#F4EFF8 0%,#E4DCEF 45%,#C9BCDD 100%);font-family:'Inter Tight',sans-serif;color:#3E3352;position:relative}
.nav{position:absolute;top:44px;left:72px;right:72px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:300}
.nav b{font-weight:400}
.c{position:absolute;left:120px;top:250px;width:760px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:168px;line-height:.9;margin:0;letter-spacing:-.01em}
h1 i{display:block;font-size:110px;color:#8A73B0}
p{font-size:24px;line-height:1.5;margin:38px 0 0;max-width:560px;font-weight:300}
.btn{display:inline-block;margin-top:44px;padding:20px 38px;border:1px solid #3E3352;border-radius:999px;font-size:16px;letter-spacing:.2em;text-transform:uppercase}
.ring{position:absolute;right:120px;top:170px;width:520px;height:520px;border-radius:50%;border:1px solid rgba(62,51,82,.35)}
.ring:before{content:'';position:absolute;inset:44px;border-radius:50%;border:1px solid rgba(201,162,39,.7)}
.ring:after{content:'';position:absolute;inset:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0%,#E9E1F3 55%,#CDBFE0 100%);box-shadow:0 30px 80px rgba(62,51,82,.18)}
.leaf{position:absolute;right:300px;top:120px;width:2px;height:640px;background:linear-gradient(transparent,rgba(62,51,82,.25),transparent)}
.foot{position:absolute;left:72px;bottom:44px;font-size:14px;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
</style></head><body>
<div class="nav"><b>Mantra</b><span>Servicios · Turnos · Contacto</span></div>
<div class="leaf"></div><div class="ring"></div>
<div class="c"><h1>Mantra<i>Estética</i></h1><p>Servicios claros y turnos en dos toques por WhatsApp.</p><span class="btn">Reservar turno</span></div>
<div class="foot">Centro de estética</div>
</body></html>
